name: olist-data-warehouse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olist}
      POSTGRES_USER: ${POSTGRES_USER:-olist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: 
        [
          "CMD-SHELL", 
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    
    profiles:
      - tools
    
    depends_on:
      postgres:
        condition: service_healthy
    
    environment:
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-olist}
      POSTGRES_USER: ${POSTGRES_USER:-olist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-raw}
      POSTGRES_AUDIT_SCHEMA: ${POSTGRES_AUDIT_SCHEMA:-pipeline_metadata}

      DBT_TARGET: postgres_dev
      DBT_RAW_DATABASE: ${POSTGRES_DB:-olist}
      DBT_RAW_SCHEMA: ${POSTGRES_SCHEMA:-raw}
      DBT_POSTGRES_SCHEMA: ${DBT_POSTGRES_SCHEMA:-dbt_dev}
      OLIST_LOG_DIR: /app/logs

    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"

    volumes:
      - ./data:/app/data 
      - ./dbt:/app/dbt 
      - ./logs:/app/logs
      - ./settings.yaml:/app/settings.yaml:ro
    
    command:
      - olist-check-postgres


volumes:
  postgres_data:
