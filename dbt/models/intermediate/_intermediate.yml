version: 2

models:
  - name: int_order_item_metrics
    description: >
      Additive order-item measures aggregated to one row per order_id.
      Monetary values are expressed in BRL.
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: text
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: item_count
        data_type: bigint
        data_tests: [not_null]

      - name: distinct_product_count
        data_type: bigint
        data_tests: [not_null]

      - name: item_subtotal_brl
        data_type: double precision
        data_tests: [not_null]

      - name: freight_total_brl
        data_type: double precision
        data_tests: [not_null]

      - name: order_item_total_brl
        data_type: double precision
        data_tests: [not_null]

      - name: item_metrics_updated_at
        data_type: timestamp without time zone

  - name: int_order_payment_metrics
    description: Payment measures aggregated to one row per order_id.
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: text
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: payment_record_count
        data_type: bigint
        data_tests: [not_null]

      - name: payment_method_count
        data_type: bigint
        data_tests: [not_null]

      - name: maximum_installments
        data_type: bigint
        data_tests: [not_null]

      - name: payment_total_brl
        data_type: double precision
        data_tests: [not_null]
      
      - name: payment_metrics_updated_at
        data_type: timestamp without time zone

  - name: int_order_reviews_deduplicated
    description: >
      Latest review selected deterministically at one row per reviewed order.
    config:
      contract:
        enforced: true
    columns:
      - name: review_id
        data_type: text
        data_tests: [not_null]

      - name: order_id
        data_type: text
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: review_score
        data_type: bigint
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

      - name: review_title
        data_type: text

      - name: review_message
        data_type: text

      - name: review_created_ts
        data_type: timestamp without time zone

      - name: review_answered_ts
        data_type: timestamp without time zone

      - name: review_record_count
        data_type: bigint
        data_tests: [not_null]
      
      - name: review_metrics_updated_at
        data_type: timestamp without time zone

  - name: int_product_categories
    description: >
      Products enriched with translated and fallback category names at one
      row per product_id.
    config:
      contract:
        enforced: true
    columns:
      - name: product_id
        data_type: text
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: product_category_name_portuguese
        data_type: text

      - name: product_category_name_english
        data_type: text

      - name: product_category_name
        data_type: text
        data_tests: [not_null]

      - name: has_english_translation
        data_type: boolean
        data_tests: [not_null]

      - name: product_name_length
        data_type: bigint

      - name: product_description_length
        data_type: bigint

      - name: product_photos_quantity
        data_type: bigint

      - name: product_weight_g
        data_type: bigint

      - name: product_length_cm
        data_type: bigint

      - name: product_height_cm
        data_type: bigint

      - name: product_width_cm
        data_type: bigint

  - name: int_geolocation_zip_codes
    description: >
      Canonical city, state, and mean coordinates at one row per postal-code
      prefix.
    config:
      contract:
        enforced: true
    columns:
      - name: geo_zip_code_prefix
        data_type: text
        data_tests: [not_null, unique]

      - name: geo_city
        data_type: text
        data_tests: [not_null]

      - name: geo_state_code
        data_type: text
        data_tests: [not_null]

      - name: latitude
        data_type: double precision

      - name: longitude
        data_type: double precision

      - name: geolocation_observation_count
        data_type: bigint
        data_tests: [not_null]

      - name: coordinate_observation_count
        data_type: bigint
        data_tests: [not_null]
  
  - name: int_orders_enriched
    description: >
      Canonical order-grain model containing customer identity, lifecycle
      timestamps, delivery measures, item totals, payment totals, and the
      deterministically selected review. Exactly one row per order_id.
      Delivery delay is a signed whole-day duration truncated toward zero,
      while the late-delivery flag compares exact timestamps. A sub-day late
      delivery can therefore have zero delay days and still be marked late.
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: text
        description: Source order key.
        data_tests: [not_null, unique]

      - name: customer_id
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      
      - name: customer_unique_id
        data_type: text
        data_tests: [not_null]

      - name: order_status
        data_type: text
        data_tests: [not_null]

      - name: order_purchase_ts
        data_type: timestamp without time zone
        data_tests: [not_null]

      - name: order_purchase_date
        data_type: date
        data_tests: [not_null]

      - name: order_approved_ts
        data_type: timestamp without time zone

      - name: order_delivered_carrier_ts
        data_type: timestamp without time zone

      - name: order_delivered_customer_ts
        data_type: timestamp without time zone

      - name: order_estimated_delivery_ts
        data_type: timestamp without time zone
        data_tests: [not_null]

      - name: is_delivered
        data_type: boolean
        data_tests: [not_null]

      - name: delivery_duration_days
        data_type: bigint

      - name: delivery_delay_days
        data_type: bigint

      - name: is_late_delivery
        data_type: boolean

      - name: has_order_items
        data_type: boolean
        data_tests: [not_null]

      - name: item_count
        data_type: bigint
        data_tests: [not_null]

      - name: distinct_product_count
        data_type: bigint
        data_tests: [not_null]

      - name: item_subtotal_brl
        data_type: double precision
        data_tests: [not_null]

      - name: freight_total_brl
        data_type: double precision
        data_tests: [not_null]

      - name: order_item_total_brl
        data_type: double precision
        data_tests: [not_null]

      - name: has_payment
        data_type: boolean
        data_tests: [not_null]

      - name: payment_record_count
        data_type: bigint
        data_tests: [not_null]

      - name: payment_method_count
        data_type: bigint
        data_tests: [not_null]

      - name: maximum_installments
        data_type: bigint

      - name: payment_total_brl
        data_type: double precision
        data_tests: [not_null]

      - name: payment_item_difference_brl
        data_type: double precision
        data_tests: [not_null]

      - name: has_review
        data_type: boolean
        data_tests: [not_null]

      - name: review_id
        data_type: text

      - name: review_score
        data_type: bigint

      - name: review_title
        data_type: text

      - name: review_message
        data_type: text

      - name: review_created_ts
        data_type: timestamp without time zone

      - name: review_answered_ts
        data_type: timestamp without time zone

      - name: review_record_count
        data_type: bigint
        data_tests: [not_null]
      
      - name: order_updated_at
        data_type: timestamp
        description: Raw ingestion timestamp of the order record.
        data_tests:
          - not_null

      - name: customer_updated_at
        data_type: timestamp
        description: Raw ingestion timestamp of the joined customer record.

      - name: item_metrics_updated_at
        data_type: timestamp
        description: Latest raw ingestion timestamp among the order's item records.

      - name: payment_metrics_updated_at
        data_type: timestamp
        description: Latest raw ingestion timestamp among the order's payment records.

      - name: review_metrics_updated_at
        data_type: timestamp
        description: Latest raw ingestion timestamp among all reviews for the order.

      - name: warehouse_updated_at
        data_type: timestamp
        description: Latest relevant source-ingestion timestamp affecting the enriched order.
        data_tests:
          - not_null
