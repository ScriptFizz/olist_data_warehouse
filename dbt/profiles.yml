olist_warehouse:
  target: "{{ env_var('DBT_TARGET', 'postgres_dev') }}"

  outputs:
    postgres_dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'olist') }}"
      user:  "{{ env_var('POSTGRES_USER', 'olist') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      schema: "{{ env_var('DBT_POSTGRES_SCHEMA', 'dbt_dev') }}"
      threads: 4
      connect_timeout: 10
      retries: 1

    bigquery_dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('BIGQUERY_PROJECT_ID', 'not-configured') }}"
      dataset: "{{ env_var('BIGQUERY_DBT_DATASET', 'olist_dbt_dev') }}"
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '/tmp/not-configured.json') }}"
      location: "{{ env_var('BIGQUERY_LOCATION', 'EU') }}"
      threads: 4
      timeout_seconds: 300