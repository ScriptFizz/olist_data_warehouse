datasources:
  postgres:
    url: jdbc:postgresql://kestra-postgres:5432/kestra
    driver-class-name: org.postgresql.Driver
    username: kestra
    password: ${KESTRA_DB_PASSWORD}

kestra:
  server:
    basic-auth:
      username: ${OLIST_KESTRA_USERNAME}
      password: ${OLIST_KESTRA_PASSWORD}

  repository:
    type: postgres

  queue:
    type: postgres

  storage:
    type: local
    local:
      base-path: /app/storage

  tasks:
    tmp-dir:
      path: /tmp/kestra-wd/tmp

  plugins:
    configurations:
      - type: io.kestra.plugin.scripts.runner.docker.Docker
        values:
          volume-enabled: true

  url: http://localhost:8080/
